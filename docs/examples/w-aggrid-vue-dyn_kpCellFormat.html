<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>w-component-vue</title>

    <!-- @babel/polyfill -->
    <script
        nomodule
        src="https://cdn.jsdelivr.net/npm/@babel/polyfill/dist/polyfill.min.js"
    ></script>

    <!-- vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.min.js"></script>

    <!-- extractHtml已自動添加@babel/polyfill與vue -->

    <!-- fontawesome -->
    <link
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css"
        rel="stylesheet"
    />

    <!-- mdi, 各組件使用mdi/js會於轉單頁時改為mdi icon, 故需引用mdi/css -->
    <link
        href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
        rel="stylesheet"
    />

    <!-- google, 各組件使用mdi/js故不需引用 -->
    <link
        _href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900"
        rel="stylesheet"
    />
    <link
        _href="https://fonts.googleapis.com/css?family=Material+Icons"
        rel="stylesheet"
    />

    <!-- data -->
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataAAPL.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataUSD2EUR.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataTemperature.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataHousePriceArea.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataFlare.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRain.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRainClip.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataCivilSoilCodeIcon.js"
    ></script>

    <!-- w-component-vue -->
    <script src="https://cdn.jsdelivr.net/npm/w-component-vue@2.5.11/dist/w-component-vue.umd.js"></script>

    <style>
  /* 組件所須全域樣式 */
  .item {
    /* 因item位於demolink, 提取各範例html後會刪除demolink, 故得額外補上 */
    border-left: 3px solid #ffba75;
    margin: 5px 5px 8px 0px;
    padding: 3px 3px 5px 10px;
    font-size: 0.9rem;
    display: flex;
    justify-content: flex-start;
    align-items: center;
  }
  .head1 {
    padding: 0px 0px 20px 0px;
    font-size: 2.5rem;
  }
  .bkh {
    /* 寬 */
    padding: 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkh {
      padding: 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkh {
      padding: 5px;
    }
  }
  .bk {
    /* 寬 */
    display: inline-block;
    vertical-align: top;
    padding: 0px 80px 60px 0px;
  }
  @media screen and (max-width: 1000px) {
    /* 中窄 */
    .bk {
      display: block;
      padding: 0px 0px 50px 0px;
    }
  }
  .cpitem {
    transition: all 0.3s;
    padding: 5px 15px;
    cursor: pointer;
  }
  .cpitem-white {
    background: #fff;
  }
  .cpitem-white:hover {
    background: #eee;
  }
  .cpitem-black {
    background: #333;
  }
  .cpitem-black:hover {
    background: #555;
  }
    </style>
</head>
<body
    style="font-family:'Microsoft JhengHei','Avenir','Helvetica'; padding:0px; margin:0px;"
>
    <v-app id="app" class="bkh" style="font-family:inherit;">
        <div class="head1">
            <span
                style="cursor:pointer;"
                title="open for copy link to view component"
                onclick="window.open('//yuda-lyu.github.io/w-component-vue/examples/app.html?cmp='+this.innerText,'_blank')"
            >w-aggrid-vue-dyn</span>
        </div>
        <div class="bk">
            <div class="item">kpCellFormat</div>

            <w-aggrid-vue-dyn
                style="width:620px;"
                ref="rftable"
                :opt="WAggridVueDyn.opt6"
            ></w-aggrid-vue-dyn>
        </div>
    </v-app>

    <script>
  //install
  Vue.use(window["w-component-vue"]);

  //initialize
  new Vue({
    el: "#app",

    data: function() {
      let keys = ["make", "model", "price"];
      let rows = [
        { make: "Toyota", model: "Celica", price: 35000 },
        { make: "Ford", model: "Mondeo", price: 32000 },
        { make: "Porsche", model: "Boxter", price: 72000 },
        { make: "BMW", model: "Sedan", price: 66000 },
        { make: "Nissan", model: "March", price: 61000 },
        { make: "Lexus", model: "RX", price: 56000 },
        { make: "Audi", model: "A6 Allroad", price: 45000 },
        { make: "Mazda", model: "MX-5", price: 36000 },
        { make: "Mercedes-Benz", model: "Cabriolet", price: 86000 },
        { make: "Volkswagen", model: "Beetle", price: 68000 },
        { make: "Honda", model: "City", price: 69000 },
        { make: "Volvo", model: "S60", price: 71000 },
        { make: "Subaru", model: "BRZ", price: 48000 }
      ];
      return {
        WAggridVueDyn: {
          opt1: {
            keys,
            rows
          },
          opt2: {
            keys,
            rows,
            defCellEditable: true
          },
          opt3: {
            keys,
            rows,
            kpHeadFilterType: {
              //default: num (num,text,time,set)
              make: "text",
              model: "text",
              price: "num"
            }
          },
          opt4: {
            keys,
            rows,
            kpCellEditable: {
              //default: false
              price: true
            },
            kpRowStyle: {
              price: function(v) {
                if (v >= 70000) {
                  return { background: "#fac" };
                }
                return {};
              }
            }
          },
          opt6: {
            keys,
            rows,
            kpHeadFilterType: {
              //default: num (num,text,time,set)
              make: "text",
              model: "text",
              price: "num"
            },
            kpCellFormat: {
              //格式化僅影響顯示與下載, 排序與過濾仍依原值
              make: function(value, key, row, params) {
                //空值(null、undefined、空字串)會原樣傳入, 回傳null代表不格式化維持原值
                if (value === null || value === undefined || value === "") {
                  return null;
                }
                return String(value).toUpperCase();
              },
              price: function(value, key, row, params) {
                //空值不可直接Number(), 否則''與null會變成0.00
                if (value === null || value === undefined || value === "") {
                  return null;
                }
                return Number(value).toLocaleString("en-US", {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
                });
              }
            }
          },
          opt5: (function(a, b) {
            let c = [];
            for (let d = 1; d <= a; d++) c.push("Col-" + d);
            let d = {};
            for (let e = 1; e <= a; e++) d[c[e - 1]] = "Cell-" + e;
            let e = [];
            for (let f, g = 1; g <= b; g++) {
              f = JSON.parse(JSON.stringify(d));
              for (let b = 1; b <= a; b++) f[c[b - 1]] += "-" + g;
              e.push(f);
            }
            return { keys: c, rows: e };
          })(100, 10000)
        },
        actions: []
      };
    },
    mounted: function() {
      return {};
    },
    computed: {},
    methods: {}
  });
    </script>
</body>
</html>
