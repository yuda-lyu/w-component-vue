<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>w-component-vue</title>

    <!-- @babel/polyfill -->
    <script
        nomodule
        src="https://cdn.jsdelivr.net/npm/@babel/polyfill/dist/polyfill.min.js"
    ></script>

    <!-- vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.min.js"></script>

    <!-- extractHtml已自動添加@babel/polyfill與vue -->

    <!-- fontawesome -->
    <link
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css"
        rel="stylesheet"
    />

    <!-- mdi, 各組件使用mdi/js會於轉單頁時改為mdi icon, 故需引用mdi/css -->
    <link
        href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
        rel="stylesheet"
    />

    <!-- google, 各組件使用mdi/js故不需引用 -->
    <link
        _href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900"
        rel="stylesheet"
    />
    <link
        _href="https://fonts.googleapis.com/css?family=Material+Icons"
        rel="stylesheet"
    />

    <!-- data -->
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataAAPL.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataUSD2EUR.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataTemperature.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataHousePriceArea.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataFlare.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRain.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRainClip.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataCivilSoilCodeIcon.js"
    ></script>

    <!-- w-component-vue -->
    <script src="https://cdn.jsdelivr.net/npm/w-component-vue@2.5.22/dist/w-component-vue.umd.js"></script>

    <style>
  /* 組件所須全域樣式 */
  .item {
    /* 因item位於demolink, 提取各範例html後會刪除demolink, 故得額外補上 */
    border-left: 3px solid #ffba75;
    margin: 5px 5px 8px 0px;
    padding: 3px 3px 5px 10px;
    font-size: 0.9rem;
    display: flex;
    justify-content: flex-start;
    align-items: center;
  }
  .head1 {
    padding: 0px 0px 20px 0px;
    font-size: 2.5rem;
  }
  .bkh {
    /* 寬 */
    padding: 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkh {
      padding: 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkh {
      padding: 5px;
    }
  }
  .bk {
    /* 寬 */
    display: inline-block;
    vertical-align: top;
    padding: 0px 80px 60px 0px;
  }
  @media screen and (max-width: 1000px) {
    /* 中窄 */
    .bk {
      display: block;
      padding: 0px 0px 50px 0px;
    }
  }
  .cpitem {
    transition: all 0.3s;
    padding: 5px 15px;
    cursor: pointer;
  }
  .cpitem-white {
    background: #fff;
  }
  .cpitem-white:hover {
    background: #eee;
  }
  .cpitem-black {
    background: #333;
  }
  .cpitem-black:hover {
    background: #555;
  }
    </style>
</head>
<body
    style="font-family:'Microsoft JhengHei','Avenir','Helvetica'; padding:0px; margin:0px;"
>
    <v-app id="app" class="bkh" style="font-family:inherit;">
        <div class="head1">
            <span
                style="cursor:pointer;"
                title="open for copy link to view component"
                onclick="window.open('//yuda-lyu.github.io/w-component-vue/examples/app.html?cmp='+this.innerText,'_blank')"
            >w-pick-surface</span>
        </div>
        <div class="bk">
            <div class="item">locLeft(sync) &amp; locTop(sync)</div>

            <!-- 二維時locLeft與locTop皆可各自以.sync綁定 -->
            <!-- axis為'x'時不發出update:locTop, 故一維面上綁定locTop不會把外部變數歸零 -->
            <div style="padding:5px 0px;">
                <div
                    :style="`font-size:0.8rem; display:inline-block; vertical-align:middle;`"
                >locLeft:</div>
                <div
                    :style="`padding-left:5px; font-size:0.8rem; display:inline-block; vertical-align:middle;`"
                >{{WPickSurface.loc5Left}}</div>
                <div
                    :style="`padding-left:15px; font-size:0.8rem; display:inline-block; vertical-align:middle;`"
                >locTop:</div>
                <div
                    :style="`padding-left:5px; font-size:0.8rem; display:inline-block; vertical-align:middle;`"
                >{{WPickSurface.loc5Top}}</div>
            </div>

            <w-pick-surface
                :width="200"
                :height="120"
                :cursor-size="14"
                :axis="'xy'"
                :loc-left.sync="WPickSurface.loc5Left"
                :loc-top.sync="WPickSurface.loc5Top"
            >
                <div
                    style="width:100%; height:100%; background-color:#fafafa; background-image:linear-gradient(to right, #dddddd 1px, transparent 1px), linear-gradient(to bottom, #dddddd 1px, transparent 1px); background-size:20px 20px;"
                ></div>
            </w-pick-surface>
        </div>
    </v-app>

    <script>
  //install
  Vue.use(window["w-component-vue"]);

  //initialize
  new Vue({
    el: "#app",

    data: function() {
      return {
        WPickSurface: {
          loc1: 60,

          loc2: { left: 100, top: 60 },

          loc3: 150,

          loc4: 80,

          loc5Left: 70,
          loc5Top: 40,

          loc6: 100,
          pick6: "",
          dragging6: false,

          loc7: 90,

          loc8: 140
        },
        actions: []
      };
    },
    mounted: function() {
      return {};
    },
    computed: {},
    methods: {
      pickEv: function(msg) {
        let vo = this;
        vo.WPickSurface.loc6 = msg.left;
        vo.WPickSurface.pick6 = `left:${
          msg.left
        } ratioLeft:${msg.ratioLeft.toFixed(3)} pointerType:${msg.pointerType}`;
        vo.WPickSurface.dragging6 = true;
      },

      pickEndEv: function() {
        let vo = this;
        vo.WPickSurface.dragging6 = false;
      }
    }
  });
    </script>
</body>
</html>
